name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # The unit tests run anywhere. The integration tests check the struct offsets
      # against a real library and skip themselves unless FFmpeg 7.x, 8.x or 9.x is
      # loadable, so install it on the runner, or set MEDIATOOLKITNET_FFMPEG_DIR to
      # a directory holding the shared libraries, to have them run here.
      - name: Test
        run: dotnet test -c Release --no-build

      # Every backend is compiled into every build and guarded at runtime, so the
      # registry has to survive being probed on an OS where none of the native
      # media libraries exist. This catches a backend whose IsAvailable throws
      # instead of returning false.
      - name: Smoke test the backend registry
        run: dotnet run --project samples/MediaToolkitNet.Sample.Cli -c Release --no-build -- backends

  pack:
    name: pack
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # SourceLink embeds the commit, so the full history has to be present.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack -c Release -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
